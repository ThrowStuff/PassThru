plugins { id 'com.android.application' }

// Release signing: point PASSTHRU_SIGNING at a keystore.properties file kept
// OUTSIDE the repository (storeFile, storePassword, keyAlias, keyPassword).
// Without it, release builds are produced unsigned.
def signingProps = new Properties()
def signingFile = System.getenv('PASSTHRU_SIGNING') ? file(System.getenv('PASSTHRU_SIGNING')) : null
if (signingFile != null && signingFile.isFile()) { signingFile.withInputStream { signingProps.load(it) } }

android {
    namespace 'org.passthru.cade'
    buildFeatures { buildConfig true }
    compileSdk 35
    defaultConfig { applicationId 'org.passthru.cade'; minSdk 29; targetSdk 35; versionCode 1; versionName '2.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingProps.getProperty('storeFile')) {
            release {
                storeFile file(signingProps.getProperty('storeFile'))
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingProps.getProperty('storeFile')) { signingConfig signingConfigs.release }
        }
    }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
